name: Publish package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure running on master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "This workflow can only be triggered from the master branch."
          exit 1

  publish:
    needs: check-branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate version input
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ inputs.version }}. Expected X.Y.Z"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Replace package.json file
        run: cp package.types.json package.json

      - name: Install deps
        run: npm i

      - name: Build types package
        run: tsc -p tsconfig.types.json

      - name: Copy package.json to dist output
        run: cp package.json dist-types/package.json

      - name: Set version from input
        run: npm version ${{ inputs.version }} --no-git-tag-version
        working-directory: dist-types

      - name: Publish to npm
        run: npm publish --provenance
        working-directory: dist-types